{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Add a New Pet</h2>
    <form method="POST" action="{{ url_for('add_pet') }}">
        <div class="form-group">
            <label for="name">Pet Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="type">Type (e.g., Dog, Cat, Bird)</label>
            <input type="text" id="type" name="type" required>
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label for="years">Age (Years)</label>
                <input type="number" id="years" name="years" min="0" value="0" required>
            </div>
            <div style="flex: 1;">
                <label for="months">Age (Months)</label>
                <input type="number" id="months" name="months" min="0" max="11" value="0" required>
            </div>
        </div>
        <button type="submit" class="btn">Add Pet</button>
    </form>
</div>
{% endblock %}
