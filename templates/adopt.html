{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Adopt {{ pet.name }}</h2>
    <p>Please fill out your details to complete the adoption of <strong>{{ pet.name }}</strong> ({{ pet.type }}, {{ pet.age }} old).</p>
    <br>
    <form method="POST" action="{{ url_for('adopt', pet_id=pet.pet_id) }}">
        <div class="form-group">
            <label for="adopter_name">Your Full Name</label>
            <input type="text" id="adopter_name" name="adopter_name" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" required>
        </div>
        <button type="submit" class="btn">Confirm Adoption</button>
    </form>
</div>
{% endblock %}
